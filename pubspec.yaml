name: project_app_lock
description: "An Android-first focus app that unlocks selected apps when tasks are complete."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_mobx: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  mobx: ^2.6.1
  shared_preferences: ^2.5.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  mobx_codegen: ^2.7.8
  freezed: ^4.0.0-dev.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate with: dart run flutter_launcher_icons
# Source art lives in assets/icon (SVG masters alongside the exported PNGs).
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#F0EDFB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Source art is already drawn inside the 66% safe zone, so skip the
  # package's default 16% inset (it would shrink the mark to ~41%).
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
